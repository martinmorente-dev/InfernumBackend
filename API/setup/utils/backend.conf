<VirtualHost *:80>
    ServerName backend-infernum-original.duckdns.org
    DocumentRoot /var/www/html/public/Infernum-API/public
    RewriteEngine On
    
    <Directory /var/www/html/public/Infernum-API/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Location /storage>
        Header always set Access-Control-Allow-Origin "https://frontend-infernum-original.duckdns.org"
        Header always set Access-Control-Allow-Methods "GET, OPTIONS"
        Header always set Access-Control-Allow-Headers "*"
    </Location>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
