<VirtualHost *:80>
    ServerName backend-infernum-original.duckdns.org
    DocumentRoot /var/www/html/public/Infernum-API/public
    RewriteEngine On
    
    <Directory /var/www/html/public/Infernum-API/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>