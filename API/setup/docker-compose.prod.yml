services:
  app:
    container_name: Laravel
    build:
      context: .
      dockerfile: Dockerfile.production
    volumes:
      - "../.:/var/www/html/public"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - "db"
  db:
    image: docker.io/library/mysql:8.0
    container_name: mysql
    ports:
      - "1607:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_USER: "admin"
      MYSQL_PASSWORD: "admin"
      MYSQL_DATABASE: "Infernum"
    volumes:
      - mysql_data:/var/lib/mysql
      
volumes:
  mysql_data: